services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rabbit3_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rabbit3
    ports:
      - "5432:5432"
    volumes:
      - rabbit3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabbit3"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: rabbit3_ollama
    ports:
      - "11434:11434"
    volumes:
      - rabbit3_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  embeddings:
    build: ./mcp
    container_name: rabbit3_embeddings
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rabbit3
      OLLAMA_HOST: ollama
      EMBEDDING_MODEL: nomic-embed-text
    profiles:
      - embeddings

volumes:
  rabbit3_pgdata:
  rabbit3_ollama:
