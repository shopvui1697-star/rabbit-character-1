[project]
name = "rabbit3-mcp-movie"
version = "0.1.0"
description = "MCP server for movie search — queries rabbit3.data_archive_movie_master"
requires-python = ">=3.12"

dependencies = [
    "mcp[cli]",
    "asyncpg",
]

[project.optional-dependencies]
vector = [
    "pgvector",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100
